{{ define "main" }}
<article class="prose">
  {{ partial "title-block.html" (dict "p" .) }}
  {{ .Content }}
  {{- with .Pages }}
  <ul class="page-list">
    {{- range . }}
    <li><a href="{{ .RelPermalink }}"><span class="pl-title">{{ .Title }}</span>{{ with .Params.summary }}<span class="pl-sum">{{ . }}</span>{{ end }}</a></li>
    {{- end }}
  </ul>
  {{- end }}
</article>
{{ end }}
