{{ define "main" }}
<section class="content">
  {{ .Content }}
  {{ if gt (len .Pages) 0 }}
  <ul class="page-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">
        <span class="page-title">{{ .Title }}</span>
        {{ with .Params.summary }}
        <span class="page-summary">{{ . }}</span>
        {{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
