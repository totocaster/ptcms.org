<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="page-shell">
      {{ partial "site-header.html" . }}
      <main id="main" class="site-main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "site-footer.html" . }}
    </div>
  </body>
</html>
