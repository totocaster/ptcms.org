baseURL = 'https://plaintextcommons.org/'
title = 'Plaintext Commons'

languageCode = "us-en"
DefaultContentLanguage = "en"

uglyURLs = true

enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
canonifyURLs = false # breaks css since all links are no longer relative

disableKinds = ["taxonomy", "term"]

[module]
  [[module.imports]]
    path = "github.com/totocaster/plaintext-commons"
    version = "main"
    [[module.imports.mounts]]
      source = "MANIFESTO.md"
      target = "content/_index.md"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  author = "Plaintext Commons"
  sitename = "Plaintext Commons"
  description = "The manifesto and reference hub for the Plaintext Commons."
  tagline = "Knowledge should outlast software."

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1

[outputs]
  home = ["HTML", "RSS", "Markdown"]
  section = ["HTML", "Markdown"]
  page = ["HTML", "Markdown"]

[outputFormats]
  [outputFormats.HTML]
    mediaType = "text/html"
    baseName = "index"
    isHTML = true
    rel = "canonical"
    permalinkable = true
    noUgly = true
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    rel = "alternate"
    suffix = "md"
    permalinkable = true
    noUgly = false
