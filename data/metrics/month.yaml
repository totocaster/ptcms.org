# Example data for the month chapter of the companion: invented, not measured.
# One month of Ada's journal, October 2026, as the lines would sit in journal.metrics.
# Every chart, table and number in that chapter is computed from these lines at build time.
# The definitions match the specification's own ada/journal examples where the names overlap (M-12).
file: "journal.metrics"
month: "2026-10"
days: 31
monthName: "October"
monthLabel: "October 2026"
# The day the combine figure takes apart.
day: "2026-10-14"
dayLabel: "14 October"
# Small multiples: three metrics in one unit, drawn at one scale.
multiples: ["reading.time", "walk.time", "piano.practice"]
# The combine figure applies every combine to the values of these two metrics on that day.
fiveWays: ["room.temperature", "walk.time"]
metrics:
  - { name: "reading.time", label: "Reading time", digits: 0, unit: "min", chart: "bars" }
  - { name: "walk.time", label: "Walking time", digits: 0, unit: "min", chart: "bars" }
  - { name: "piano.practice", label: "Piano practice", digits: 0, unit: "min", chart: "bars" }
  - { name: "room.temperature", label: "Room temperature", digits: 1, unit: "°C", chart: "line" }
  - { name: "reading.pages", label: "Pages read", digits: 0, unit: "pages", chart: "bars" }
lines:
  - '{"format":"plaintext-metrics/0.2.0","set":"ada/journal","by":"Ada"}'
  - '{"define":"reading.time","v":1,"kind":"quantity","unit":"min","name":"Reading time","combine":"sum","labels":{"medium":["paper","ebook","audio"]}}'
