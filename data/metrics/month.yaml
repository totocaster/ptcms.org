  - '{"define":"piano.practice","v":1,"kind":"quantity","unit":"min","name":"Piano practice","combine":"sum"}'
  - '{"define":"room.temperature","v":1,"kind":"quantity","unit":"Cel","name":"Room temperature","combine":"mean"}'
  - '{"define":"reading.pages","v":1,"kind":"count","name":"Pages read"}'
  - '{"at":"2026-10-01T07:00+02:00","metric":"room.temperature","v":1,"value":20.6,"by":"sensor-7","ref":"r-30411"}'
