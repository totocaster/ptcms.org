- title: "Legible in any editor."
  text: "Open the file in a basic text editor and it still makes sense. The syntax reads well without being rendered."
  example: "- [ ] Ship beta\n  @due: 2026-04-01"
  caption: "A task with a due date, readable as it stands."
- title: "The file is the source of truth."
  text: "No hidden database state. Everything an app shows comes from the file, and everything it changes goes back into it."
  example: "home.tasks.md"
  caption: "One file. No sidecar database, no export step."
- title: "Patch-friendly."
  text: "A change is a small, local edit that a person or an agent can review as a diff before it is applied."
  example: "-- [ ] Ship beta\n+- [x] Ship beta\n+  @done: 2026-04-02"
  caption: "Marking a task done touches two lines."
- title: "Versioned and frozen."
  text: "Every version of a specification has its own address, and the text at that address never changes. A new version gets a new address."
  example: "/tasks/v1.0.0/"
  caption: "Cite this and the meaning cannot drift."
