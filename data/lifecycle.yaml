- stage: "Working draft"
  text: "Written in the open. Anything can still change."
- stage: "Draft"
  text: "Published at a versioned address. Open for comment and trial implementations."
- stage: "Candidate"
  text: "Complete. Changes only fix problems that implementers find."
- stage: "Stable"
  text: "Settled. Implementations can rely on it; any change in meaning needs a new version."
- stage: "Superseded"
  text: "Replaced by a newer version, which it links to. Still served, never deleted."
